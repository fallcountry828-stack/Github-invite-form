<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>GitHub組織への招待</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>GitHub組織に招待する</h1>
  <p class="lead">送信すると、GitHubから招待メールが届きます。</p>
  <p class="notice">GitHubユーザー名とメールアドレスは、どちらか一方だけ入力すれば招待できます。</p>
  <form id="f" novalidate>
    <div class="field">
      <label for="username">GitHubユーザー名 <span class="hint">（どちらか一方でOK）</span></label>
      <input id="username" name="username" maxlength="39" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="email">メールアドレス <span class="hint">（どちらか一方でOK）</span></label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="passcode">合言葉</label>
      <input id="passcode" name="passcode" type="password" maxlength="200" autocomplete="off" required>
    </div>
    <button id="btn" type="submit">招待を送る</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script src="app.js" defer></script>
</body>
</html>
