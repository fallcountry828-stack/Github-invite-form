<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub組織への招待</title>
<style>
  :root {
    --bg: #f3f5f2; --surface: #ffffff; --ink: #1d2a24; --muted: #5b6b62;
    --line: #cfd8d2; --accent: #1f6f4a; --accent-ink: #ffffff;
    --ok-bg: #e3f3ea; --err-bg: #fbe7e4; --err: #a3281b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17; --surface: #1c2420; --ink: #e6eee9; --muted: #98aa9f;
      --line: #33423a; --accent: #4cc38a; --accent-ink: #0d1713;
      --ok-bg: #1d3a2b; --err-bg: #3d1f1b; --err: #ff9d90;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: var(--muted); font-size: .92rem; }
  .notice { margin: 0 0 16px; padding: 10px 12px; font-size: .88rem; border-left: 4px solid var(--accent); background: var(--ok-bg); border-radius: 0 6px 6px 0; }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  .field { margin-bottom: 18px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { margin-top: 16px; padding: 10px 12px; border-radius: 6px; font-size: .92rem; display: none; }
  #msg.ok { display: block; background: var(--ok-bg); }
  #msg.err { display: block; background: var(--err-bg); color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>GitHub組織に招待する</h1>
  <p class="lead">送信すると、GitHubから招待メールが届きます。</p>
  <p class="notice">GitHubユーザー名とメールアドレスは、どちらか一方だけ入力すれば招待できます。</p>
  <form id="f">
    <div class="field">
      <label for="fullName">氏名</label>
      <input id="fullName" name="fullName" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="username">GitHubユーザー名 <span class="hint">（どちらか一方でOK）</span></label>
      <input id="username" name="username" autocomplete="off" autocapitalize="none">
    </div>
    <div class="field">
      <label for="email">メールアドレス <span class="hint">（どちらか一方でOK）</span></label>
      <input id="email" name="email" type="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="passcode">合言葉</label>
      <input id="passcode" name="passcode" type="password" autocomplete="off" required>
    </div>
    <button id="btn" type="submit">招待を送る</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
  const f = document.getElementById("f");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!f.username.value.trim() && !f.email.value.trim()) {
      msg.className = "err";
      msg.textContent = "GitHubユーザー名かメールアドレスのどちらか一方を入力してください";
      return;
    }
    btn.disabled = true; msg.className = ""; msg.textContent = "";
    try {
      const res = await fetch("/api/invite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.fromEntries(new FormData(f))),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "送信に失敗しました");
      msg.className = "ok"; msg.textContent = data.message;
      f.reset();
    } catch (err) {
      msg.className = "err"; msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
